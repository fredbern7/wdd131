<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Berny Fred">
    <meta name="description" content="This page presents the requirements for creating a Product Review form in a best practice.">
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Assignment: Form</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <h2>Product Review</h2>
            <label for="product">Product Name
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </label>
            <div>
                Overall Rating 
                <label for="1"> &star;
                    <input type="radio" name="1" value="1" id="1" required> 
                </label>
                <label for="2"> &star; &star;
                    <input type="radio" name="2" value="2" id="2" required>
                </label>

                <label for="3"> &star; &star; &star;
                    <input type="radio" name="3" value="3" id="3" required>
                </label>

                <label for="4"> &star; &star; &star; &star;
                    <input type="radio" name="4" value="4" id="4" required>
                </label>

                <label for="5"> &star; &star; &star; &star; &star;
                    <input type="radio" name="5" value="5" id="5" required>
                </label>           
            </div>

            <label for="date">Date of Installation
                <input type="date" name="date" id="date" required>
            </label>

            <label for="features">
                <div class="">
                    <p>Which features did you find useful in the product?</p>
                    <p>(check all that apply)</p>
                </div>
                <label for="durability">
                    <input type="checkbox" name="durability" id="durability" value="durability">
                    Durability
                </label>
                <label for="ease">
                    <input type="checkbox" name="ease" id="ease">
                    Ease of Use
                </label>
                <label for="performance">
                    <input type="checkbox" name="performance" id="performance">
                    Performance
                </label>
                <label for="design">
                    <input type="checkbox" name="design" id="design">
                    Design
                </label>

            </label>

            <label for="review">
                Written Review (Optional)
                <textarea name="review" id="review"></textarea>
            </label>

            <label for="name">
                Your Name (Optional)
                <input type="text" name="name" id="name">
            </label>

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&#xA9; <span id="currentyear"></span> | Berny Fred | FSM</p>
        <p>Last modified: <span id="lastModified">.</span></p>
    </footer>
</body>
</html>
