<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="This page is for a responsive form for product review.">
    <meta name="author" content="Berny Fred">
    
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="submit">
            <label for="product">
                <option value="product">
                    <select name="" id="">Turtle</select>
                    <select name="" id="">Turtle</select>
                    <select name="" id="">Turtle</select>
                </option>
            </label>
            <label for="rating">
                <input type="radio" name="rating" id="rading">
            </label>
            <label for="date">
                Date of installation
                <input type="date" name="date" id="date">
            </label>
            <label for="features">
                <input type="checkbox" name="features" id="features">
            </label>
            <label for="review">
                Written Review (Optional)
                <textarea name="review" id="review"></textarea>
            </label>
            <label for="name">
                Your Name (Optional)
                <input type="text">
            </label>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&#xA9; <span id="currentyear"></span> | Berny Fred | FSM</p>
        <p>Last modified: <span id="lastModified">.</span></p>
    </footer>
</body>
</html>
